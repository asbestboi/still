# Builds Still for Linux (AppImage), Windows (.exe) and macOS (.dmg).
# Push a tag like v0.2.0 to publish them as a GitHub release;
# run it by hand from the Actions tab to just get the files as artifacts.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    name: Linux AppImage
    # an older base keeps the AppImage compatible with older distributions (glibc 2.35)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test
        run: cargo test --release
      - name: Build
        run: cargo build --release
      - name: Package AppImage
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
          OUTPUT: Still-x86_64.AppImage
        run: |
          mkdir -p AppDir/usr/bin AppDir/usr/share/applications AppDir/usr/share/icons/hicolor/256x256/apps
          install -m755 target/release/still AppDir/usr/bin/still
          install -m644 still.desktop AppDir/usr/share/applications/still.desktop
          install -m644 assets/icon-256.png AppDir/usr/share/icons/hicolor/256x256/apps/still.png
          wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          chmod +x linuxdeploy-x86_64.AppImage
          ./linuxdeploy-x86_64.AppImage --appdir AppDir \
            --desktop-file AppDir/usr/share/applications/still.desktop \
            --icon-file AppDir/usr/share/icons/hicolor/256x256/apps/still.png \
            --output appimage
          ls -la Still-x86_64.AppImage
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: Still-x86_64.AppImage

  windows:
    name: Windows exe
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test
        run: cargo test --release
      - name: Build
        run: cargo build --release
      - name: Package
        shell: pwsh
        run: Copy-Item target/release/still.exe Still-windows-x64.exe
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: Still-windows-x64.exe

  macos:
    name: macOS dmg
    runs-on: macos-latest
    env:
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - name: Test
        run: cargo test --release
      - name: Build (Apple Silicon + Intel)
        run: |
          cargo build --release --target aarch64-apple-darwin
          cargo build --release --target x86_64-apple-darwin
          lipo -create -output still \
            target/aarch64-apple-darwin/release/still \
            target/x86_64-apple-darwin/release/still
          lipo -info still
      - name: Package app and dmg
        run: |
          VERSION=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          APP=dmg/Still.app
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"
          install -m755 still "$APP/Contents/MacOS/still"

          ICONSET=Still.iconset
          mkdir -p $ICONSET
          for s in 16 32 128 256 512; do
            sips -z $s $s assets/icon.png --out $ICONSET/icon_${s}x${s}.png >/dev/null
            d=$((s * 2))
            if [ $d -le 1024 ]; then
              sips -z $d $d assets/icon.png --out $ICONSET/icon_${s}x${s}@2x.png >/dev/null
            fi
          done
          iconutil -c icns $ICONSET -o "$APP/Contents/Resources/Still.icns"

          cat > "$APP/Contents/Info.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleName</key><string>Still</string>
            <key>CFBundleDisplayName</key><string>Still</string>
            <key>CFBundleIdentifier</key><string>io.github.still</string>
            <key>CFBundleExecutable</key><string>still</string>
            <key>CFBundleIconFile</key><string>Still</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleShortVersionString</key><string>${VERSION}</string>
            <key>CFBundleVersion</key><string>${VERSION}</string>
            <key>LSMinimumSystemVersion</key><string>11.0</string>
            <key>LSApplicationCategoryType</key><string>public.app-category.photography</string>
            <key>NSHighResolutionCapable</key><true/>
          </dict>
          </plist>
          PLIST
          plutil -lint "$APP/Contents/Info.plist"

          # ad-hoc signature: required for Apple Silicon to run it at all
          codesign --force --deep --sign - "$APP"
          codesign --verify --verbose "$APP"

          ln -s /Applications dmg/Applications
          hdiutil create -volname Still -srcfolder dmg -ov -format UDZO Still-macos.dmg
          ls -la Still-macos.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: Still-macos.dmg

  release:
    name: Publish release
    needs: [linux, windows, macos]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          name: Still ${{ github.ref_name }}
          generate_release_notes: true
          body: |
            **Linux:** download `Still-x86_64.AppImage`, make it executable (`chmod +x Still-x86_64.AppImage`) and run it.
            **Windows:** download `Still-windows-x64.exe` and run it. Windows SmartScreen may warn about an unsigned app; choose *More info → Run anyway*.
            **macOS** (Apple Silicon and Intel, macOS 11+): open `Still-macos.dmg` and drag Still into Applications. The app isn't notarized, so the first time macOS will refuse to open it: go to *System Settings → Privacy & Security* and click *Open Anyway* (or run `xattr -dr com.apple.quarantine /Applications/Still.app`).
          files: |
            Still-x86_64.AppImage
            Still-windows-x64.exe
            Still-macos.dmg

[package]
name = "still"
version = "0.1.0"
edition = "2024"

[dependencies]
eframe = "0.37"
egui = "0.37"
image = "0.25"
rawler = "0.8"
rayon = "1.12.0"
rfd = "0.18.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 4

[package]
name = "still"
version = "0.3.0"
edition = "2024"

[dependencies]
eframe = "0.37"
egui = "0.37"
image = "0.25"
rawler = "0.8"
rayon = "1.12.0"
rfd = "0.18.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
trash = "5"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 4

[dev-dependencies]
egui_kittest = { version = "0.37", features = ["eframe"] }

# picks the X11 backend so dropped files arrive under Wayland (see main.rs)
[target.'cfg(target_os = "linux")'.dependencies]
winit = { version = "0.30.13", default-features = false, features = ["x11"] }
